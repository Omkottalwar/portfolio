<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <!-- Glowing orange gradient -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8c5a" />
      <stop offset="100%" stop-color="#ff6b35" />
    </linearGradient>
    
    <!-- Neon drop shadow filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark glass backdrop -->
  <polygon points="24,3 45,14 45,34 24,45 3,34 3,14" fill="#1a1a1a" stroke="url(#orangeGrad)" stroke-width="2.5" filter="url(#neonGlow)" />
  
  <!-- Cyber-grid overlay inside hexagon (subtle details) -->
  <path d="M 24 3 L 24 45 M 3 14 L 45 34 M 3 34 L 45 14" stroke="rgba(255, 107, 53, 0.15)" stroke-width="1" stroke-dasharray="2,2" />
  
  <!-- Sleek geometric Monogram "O K" or cyber core -->
  <!-- O: Left side half circle / bracket -->
  <path d="M 18,17 C 13,17 13,31 18,31" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" fill="none" />
  <path d="M 18,17 C 21,17 21,31 18,31" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.3" />

  <!-- K: Right side sharp tech branches -->
  <path d="M 27,15 L 27,33 M 27,24 L 35,16 M 27,24 L 35,32" stroke="url(#orangeGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Core energy center dot -->
  <circle cx="24" cy="24" r="2.5" fill="#ffffff" filter="url(#neonGlow)" />
</svg>